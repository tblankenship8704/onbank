<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Panel - SuperRight</title>
        <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/images/favicon-512x512.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/images/favicon-192x192.png">
    <link rel="manifest" href="assets/images/site.webmanifest">
    <link rel="icon" href="assets/images/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="/panel/assets/css/icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            background: #0d1117;
            color: #e6edf3;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
        }
        .card-header {
            background: #0d1117;
            border-bottom: 1px solid #30363d;
            font-weight: 600;
        }
        .table {
            color: #e6edf3;
        }
        .table th {
            border-bottom: 1px solid #30363d;
            font-weight: 600;
        }
        .table td {
            border-bottom: 1px solid #21262d;
            vertical-align: middle;
        }
        .btn-sm {
            font-size: 0.75rem;
        }
        .badge {
            font-size: 0.7rem;
        }
        .badge-verified { background-color: #2ea043; }
        .badge-unverified { background-color: #da3633; }
        .badge-banned { background-color: #da3633; }
        .badge-active { background-color: #2ea043; }
        .badge-suspended { background-color: #d29922; }
        .nav-tabs .nav-link {
            color: #8b949e;
        }
        .nav-tabs .nav-link.active {
            color: #f0f6fc;
            background-color: #161b22;
            border-color: #30363d;
        }
        .modal-content {
            background: #161b22;
            color: #e6edf3;
        }
        .modal-header, .modal-footer {
            border-color: #30363d;
        }
        .form-control, .form-select {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #e6edf3;
        }
        .form-control:focus, .form-select:focus {
            background: #0d1117;
            border-color: #58a6ff;
            color: #e6edf3;
        }
        .form-label {
            color: #8b949e;
        }
        .btn-primary { background: #238636; border-color: #238636; }
        .btn-primary:hover { background: #2ea043; border-color: #2ea043; }
        .btn-danger { background: #da3633; border-color: #da3633; }
        .btn-danger:hover { background: #f85149; border-color: #f85149; }
        .btn-warning { background: #d29922; border-color: #d29922; color: #0d1117; }
        .btn-warning:hover { background: #e3b341; border-color: #e3b341; }
        .btn-secondary { background: #21262d; border-color: #30363d; color: #e6edf3; }
        .btn-secondary:hover { background: #30363d; border-color: #424a53; }
        .appHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
        }
        .appHeader .pageTitle { font-size: 1.2rem; font-weight: 600; }
        .appHeader .left a { color: #e6edf3; text-decoration: none; font-size: 1.2rem; }
        #appCapsule { padding: 20px; }
        .user-row { transition: background 0.2s; }
        .user-row:hover { background: #21262d; }
        .action-buttons .btn { margin-right: 4px; }
        .balance-edit { max-width: 120px; display: inline-block; }
        .modal-lg { max-width: 90%; }
    </style>
</head>

<body>

    <!-- Admin Header -->
    <div class="appHeader">
        <div class="left">
            <a href="/dashboard.html" title="Back to Dashboard"><i class="fas fa-arrow-left"></i></a>
        </div>
        <div class="pageTitle"><i class="fas fa-crown text-warning"></i> Admin Panel</div>
        <div>
            <button class="btn btn-sm btn-secondary" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>

    <div id="appCapsule" class="container-fluid">
        <!-- Tabs -->
        <ul class="nav nav-tabs mb-3" id="adminTabs" role="tablist">
            <li class="nav-item"><button class="nav-link active" id="users-tab" data-bs-toggle="tab" data-bs-target="#users" type="button" role="tab">Users</button></li>
            <li class="nav-item"><button class="nav-link" id="notifications-tab" data-bs-toggle="tab" data-bs-target="#notifications" type="button" role="tab">Notifications</button></li>
            <li class="nav-item"><button class="nav-link" id="audit-tab" data-bs-toggle="tab" data-bs-target="#audit" type="button" role="tab">Audit Log</button></li>
        </ul>

        <div class="tab-content">
            <!-- USERS TAB -->
            <div class="tab-pane fade show active" id="users" role="tabpanel">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="fas fa-users me-2"></i>All Users</span>
                        <div>
                            <button class="btn btn-sm btn-success me-2" onclick="openCreateUser()"><i class="fas fa-user-plus"></i> Create User</button>
                            <button class="btn btn-sm btn-secondary" onclick="refreshUsers()"><i class="fas fa-sync-alt"></i> Refresh</button>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover mb-0" id="usersTable">
                                <thead>
                                    <tr>
                                        <th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Country</th><th>Status</th><th>Verified</th><th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="usersTableBody"><tr><td colspan="8" class="text-center">Loading...</td></tr></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- NOTIFICATIONS TAB -->
            <div class="tab-pane fade" id="notifications" role="tabpanel">
                <div class="card">
                    <div class="card-header">Sent Notifications</div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped mb-0">
                                <thead><tr><th>ID</th><th>User</th><th>Title</th><th>Message</th><th>Sent</th><th>Action</th></tr></thead>
                                <tbody id="notificationsTableBody"><tr><td colspan="6" class="text-center">Loading...</td></tr></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- AUDIT TAB (placeholder) -->
            <div class="tab-pane fade" id="audit" role="tabpanel">
                <div class="card"><div class="card-body"><p class="text-muted">Audit log coming soon.</p></div></div>
            </div>
        </div>
    </div>

    <!-- ========== MODALS ========== -->

    <!-- View/Edit User Modal -->
    <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">User Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="userModalBody">
                    <!-- dynamically loaded -->
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button class="btn btn-primary" onclick="saveUserEdit()"><i class="fas fa-save"></i> Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Create User Modal -->
    <div class="modal fade" id="createUserModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New User</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="createUserForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Full Name *</label>
                            <input type="text" class="form-control" id="c_fullname" placeholder="John Doe" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email *</label>
                            <input type="email" class="form-control" id="c_email" placeholder="user@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password *</label>
                            <input type="text" class="form-control" id="c_password" placeholder="Temp password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" id="c_phone" placeholder="+1234567890">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Country</label>
                            <input type="text" class="form-control" id="c_country" placeholder="Country">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Role</label>
                            <select class="form-select" id="c_role">
                                <option value="user">User</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Create User</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Edit Transaction Modal -->
    <div class="modal fade" id="editTxModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Transaction</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="editTxForm">
                    <input type="hidden" id="tx_id">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Type</label>
                            <select class="form-select" id="tx_type">
                                <option value="send">Send</option>
                                <option value="receive">Receive</option>
                                <option value="swap">Swap</option>
                                <option value="deposit">Deposit</option>
                                <option value="withdrawal">Withdrawal</option>
                                <option value="admin_adjust">Admin Adjust</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" id="tx_status">
                                <option value="pending">Pending</option>
                                <option value="completed">Completed</option>
                                <option value="failed">Failed</option>
                                <option value="cancelled">Cancelled</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Amount</label>
                            <input type="number" step="0.00000001" class="form-control" id="tx_amount">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Currency</label>
                            <input type="text" class="form-control" id="tx_currency" placeholder="BTC">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <input type="text" class="form-control" id="tx_description" placeholder="Description">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Update</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:5000';
        let currentUserId = null;
        let userWallets = [];
        let userTransactions = [];

        // ========== HELPERS ==========
        function getToken() { return localStorage.getItem('token'); }
        function getUser() { try { return JSON.parse(localStorage.getItem('user')); } catch { return null; } }
        function notify(status, msg) {
            if (typeof iziToast !== 'undefined') {
                iziToast[status]({
                    title: status.charAt(0).toUpperCase() + status.slice(1),
                    message: msg,
                    position: 'topRight',
                    backgroundColor: '#fff',
                    icon: status === 'success' ? 'fas fa-check-circle' : 'fas fa-times-circle',
                    iconColor: status === 'success' ? '#28c76f' : '#eb2222',
                    progressBarColor: status === 'success' ? '#28c76f' : '#eb2222',
                    titleColor: '#474747',
                    messageColor: '#a2a2a2',
                });
            } else { alert(msg); }
        }

        // ========== AUTH GUARD ==========
        (function checkAdmin() {
            const user = getUser();
            if (!user || user.role !== 'admin') {
                window.location.href = '/login.html';
                return;
            }
            refreshUsers();
            loadNotifications();
        })();

        // ========== REFRESH USERS ==========
        async function refreshUsers() {
            try {
                const res = await fetch(`https://rat-production-1899.up.railway.app/api/admin/users`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                if (!res.ok) {
                    const text = await res.text();
                    throw new Error(`HTTP ${res.status}: ${text.substring(0, 100)}`);
                }
                const users = await res.json();
                renderUsers(users);
            } catch (err) {
                document.getElementById('usersTableBody').innerHTML =
                    `<tr><td colspan="8" class="text-center text-danger">Error: ${err.message}</td></tr>`;
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('usersTableBody');
            if (!users || users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center">No users</td></tr>`;
                return;
            }
            let html = '';
            users.forEach(u => {
                const statusBadges = [];
                if (u.is_banned) statusBadges.push('<span class="badge badge-banned">Banned</span>');
                if (u.is_suspended) statusBadges.push('<span class="badge badge-suspended">Suspended</span>');
                if (!u.is_banned && !u.is_suspended) statusBadges.push('<span class="badge badge-active">Active</span>');
                const verifiedBadge = u.is_verified ? '<span class="badge badge-verified">Verified</span>' :
                    '<span class="badge badge-unverified">Unverified</span>';
                const roleBadge = u.role === 'admin' ? '<span class="badge bg-primary">Admin</span>' : '';
                html += `
                    <tr class="user-row" data-id="${u.id}">
                        <td>${u.id}</td>
                        <td>${u.full_name}</td>
                        <td>${u.email}</td>
                        <td>${u.phone || '-'}</td>
                        <td>${u.country || '-'}</td>
                        <td>${statusBadges.join(' ')}</td>
                        <td>${verifiedBadge} ${roleBadge}</td>
                        <td class="action-buttons">
                            <button class="btn btn-sm btn-outline-primary" onclick="viewUser(${u.id})" title="View/Edit"><i class="fas fa-eye"></i></button>
                            <button class="btn btn-sm btn-outline-success" onclick="toggleVerify(${u.id}, ${!u.is_verified})" title="Toggle Verify"><i class="fas fa-check-circle"></i></button>
                            <button class="btn btn-sm btn-outline-warning" onclick="toggleBan(${u.id}, ${!u.is_banned})" title="${u.is_banned?'Unban':'Ban'}"><i class="fas fa-gavel"></i></button>
                            <button class="btn btn-sm btn-outline-info" onclick="openBalanceModal(${u.id})" title="Adjust Balance"><i class="fas fa-coins"></i></button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="impersonate(${u.id})" title="Impersonate"><i class="fas fa-user-secret"></i></button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteUser(${u.id})" title="Delete"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        // ========== VIEW / EDIT USER ==========
        async function viewUser(id) {
            currentUserId = id;
            try {
                const res = await fetch(`https://rat-production-1899.up.railway.app/api/admin/users/${id}`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                if (!res.ok) throw new Error('Failed to fetch user details');
                const user = await res.json();
                userWallets = user.wallets || [];
                userTransactions = user.transactions || [];
                renderUserModal(user);
                new bootstrap.Modal(document.getElementById('userModal')).show();
            } catch (err) {
                notify('error', err.message);
            }
        }

        function renderUserModal(user) {
            const container = document.getElementById('userModalBody');
            // Build editable fields
            let walletsHtml = userWallets.map(w =>
                `<tr>
                    <td>${w.currency}</td>
                    <td><input type="number" step="0.00000001" class="form-control form-control-sm balance-edit" data-currency="${w.currency}" value="${w.balance}" style="width:120px;"></td>
                </tr>`
            ).join('');

            let txsHtml = userTransactions.map(tx =>
                `<tr>
                    <td>${tx.id}</td>
                    <td>${tx.currency}</td>
                    <td>${tx.amount}</td>
                    <td><span class="badge ${tx.type === 'send' ? 'bg-danger' : tx.type === 'receive' ? 'bg-success' : 'bg-secondary'}">${tx.type}</span></td>
                    <td><span class="badge ${tx.status === 'completed' ? 'bg-success' : tx.status === 'pending' ? 'bg-warning' : 'bg-danger'}">${tx.status}</span></td>
                    <td>${new Date(tx.created_at).toLocaleDateString()}</td>
                    <td><button class="btn btn-sm btn-outline-secondary" onclick="editTransaction(${tx.id})"><i class="fas fa-edit"></i></button></td>
                </tr>`
            ).join('');

            container.innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <h6>Profile</h6>
                        <div class="mb-2"><label class="form-label">Name</label><input class="form-control" id="edit_name" value="${user.full_name}"></div>
                        <div class="mb-2"><label class="form-label">Email</label><input class="form-control" id="edit_email" value="${user.email}"></div>
                        <div class="mb-2"><label class="form-label">Phone</label><input class="form-control" id="edit_phone" value="${user.phone || ''}"></div>
                        <div class="mb-2"><label class="form-label">Country</label><input class="form-control" id="edit_country" value="${user.country || ''}"></div>
                        <div class="mb-2"><label class="form-label">Role</label>
                            <select class="form-select" id="edit_role">
                                <option value="user" ${user.role === 'user' ? 'selected' : ''}>User</option>
                                <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>Admin</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Verified</label>
                            <select class="form-select" id="edit_verified">
                                <option value="true" ${user.is_verified ? 'selected' : ''}>Verified</option>
                                <option value="false" ${!user.is_verified ? 'selected' : ''}>Unverified</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Status</label>
                            <div>
                                <button class="btn btn-sm ${user.is_banned ? 'btn-danger' : 'btn-outline-secondary'}" onclick="toggleBan(${user.id}, ${!user.is_banned})">${user.is_banned ? 'Unban' : 'Ban'}</button>
                                <button class="btn btn-sm ${user.is_suspended ? 'btn-warning' : 'btn-outline-secondary'}" onclick="toggleSuspend(${user.id}, ${!user.is_suspended})">${user.is_suspended ? 'Unsuspend' : 'Suspend'}</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <h6>Wallets <button class="btn btn-sm btn-outline-primary" onclick="addWalletRow()"><i class="fas fa-plus"></i></button></h6>
                        <table class="table table-sm">
                            <thead><tr><th>Currency</th><th>Balance</th></tr></thead>
                            <tbody id="walletEditBody">
                                ${walletsHtml}
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-12">
                        <h6>Transactions <button class="btn btn-sm btn-outline-primary" onclick="addTransactionRow()"><i class="fas fa-plus"></i></button></h6>
                        <div class="table-responsive">
                            <table class="table table-sm">
                                <thead><tr><th>ID</th><th>Currency</th><th>Amount</th><th>Type</th><th>Status</th><th>Date</th><th>Action</th></tr></thead>
                                <tbody id="txEditBody">
                                    ${txsHtml}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
            // Store current user object for save
            window._currentUser = user;
        }

        // ========== SAVE USER EDITS ==========
        async function saveUserEdit() {
            const id = currentUserId;
            const name = document.getElementById('edit_name').value;
            const email = document.getElementById('edit_email').value;
            const phone = document.getElementById('edit_phone').value;
            const country = document.getElementById('edit_country').value;
            const role = document.getElementById('edit_role').value;
            const verified = document.getElementById('edit_verified').value === 'true';

            // Collect wallet balances
            const walletInputs = document.querySelectorAll('#walletEditBody .balance-edit');
            const walletUpdates = [];
            walletInputs.forEach(inp => {
                walletUpdates.push({
                    currency: inp.dataset.currency,
                    balance: parseFloat(inp.value) || 0
                });
            });

            try {
                // Update user profile
                const res = await fetch(`https://rat-production-1899.up.railway.app/api/admin/users/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${getToken()}`
                    },
                    body: JSON.stringify({ full_name: name, email, phone, country, role, is_verified: verified })
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'Update failed');
                }
                // Update wallets (one by one)
                for (const w of walletUpdates) {
                    // We'll use balance adjust endpoint with credit/debit diff
                    // Simplified: fetch current balance, compute diff, then adjust
                    const currWallet = userWallets.find(uw => uw.currency === w.currency);
                    if (currWallet) {
                        const diff = w.balance - currWallet.balance;
                        if (diff !== 0) {
                            const operation = diff > 0 ? 'credit' : 'debit';
                            const amount = Math.abs(diff);
                            await fetch(`https://rat-production-1899.up.railway.app/api/admin/users/${id}/balance`, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${getToken()}`
                                },
                                body: JSON.stringify({ currency: w.currency, amount, operation })
                            });
                        }
                    }
                }
                notify('success', 'User updated successfully');
                bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
                refreshUsers();
            } catch (err) {
                notify('error', err.message);
            }
        }

        // ========== ADD WALLET ROW (UI only, will be saved) ==========
        function addWalletRow() {
            const tbody = document.getElementById('walletEditBody');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input class="form-control form-control-sm" placeholder="Currency" value="NEW"></td>
                <td><input type="number" step="0.00000001" class="form-control form-control-sm balance-edit" data-currency="NEW" value="0"></td>
            `;
            tbody.appendChild(tr);
        }

        // ========== EDIT TRANSACTION ==========
        function editTransaction(txId) {
            const tx = userTransactions.find(t => t.id === txId);
            if (!tx) return;
            document.getElementById('tx_id').value = txId;
            document.getElementById('tx_type').value = tx.type;
            document.getElementById('tx_status').value = tx.status;
            document.getElementById('tx_amount').value = tx.amount;
            document.getElementById('tx_currency').value = tx.currency;
            document.getElementById('tx_description').value = tx.description || '';
            new bootstrap.Modal(document.getElementById('editTxModal')).show();
        }

        document.getElementById('editTxForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = document.getElementById('tx_id').value;
            const type = document.getElementById('tx_type').value;
            const status = document.getElementById('tx_status').value;
            const amount = parseFloat(document.getElementById('tx_amount').value);
            const currency = document.getElementById('tx_currency').value;
            const description = document.getElementById('tx_description').value;
            try {
                const res = await fetch(`https://rat-production-1899.up.railway.app/api/admin/transactions/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${getToken()}`
                    },
                    body: JSON.stringify({ type, status, amount, currency, description })
                });
                if (!res.ok) throw new Error('Update failed');
                notify('success', 'Transaction updated');
                bootstrap.Modal.getInstance(document.getElementById('editTxModal')).hide();
                // Re-fetch user details
                viewUser(currentUserId);
            } catch (err) {
                notify('error', err.message);
            }
        });

        // ========== TOGGLE FUNCTIONS ==========
        async function toggleVerify(id, verify) {
            try {
                const res = await fetch(`https://rat-production-1899.up.railway.app/api/admin/users/${id}/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` },
                    body: JSON.stringify({ verify })
                });
                if (!res.ok) throw new Error('Failed');
                notify('success', `User ${verify ? 'verified' : 'unverified'}`);
                refreshUsers();
            } catch (err) { notify('error', err.message); }
        }

        async function toggleBan(id, ban) {
            const action = ban ? 'ban' : 'unban';
            const confirm = await Swal.fire({ title: `${action} user?`, icon: 'warning', showCancelButton: true, confirmButtonColor: '#da3633', cancelButtonColor: '#30363d', confirmButtonText: `Yes, ${action}` });
            if (!confirm.isConfirmed) return;
            try {
                const res = await fetch(`https://rat-production-1899.up.railway.app/api/admin/users/${id}/ban`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` },
                    body: JSON.stringify({ ban })
                });
                if (!res.ok) throw new Error('Failed');
                notify('success', `User ${ban ? 'banned' : 'unbanned'}`);
                refreshUsers();
            } catch (err) { notify('error', err.message); }
        }

        async function toggleSuspend(id, suspend) {
            try {
                const res = await fetch(`https://rat-production-1899.up.railway.app/api/admin/users/${id}/suspend`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` },
                    body: JSON.stringify({ suspend, reason: suspend ? 'Suspended by admin' : null })
                });
                if (!res.ok) throw new Error('Failed');
                notify('success', `User ${suspend ? 'suspended' : 'unsuspended'}`);
                refreshUsers();
            } catch (err) { notify('error', err.message); }
        }

        async function deleteUser(id) {
            const confirm = await Swal.fire({ title: 'Delete user?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#da3633', cancelButtonColor: '#30363d', confirmButtonText: 'Yes, delete' });
            if (!confirm.isConfirmed) return;
            try {
                const res = await fetch(`https://rat-production-1899.up.railway.app/api/admin/users/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                if (!res.ok) throw new Error('Delete failed');
                notify('success', 'User deleted');
                refreshUsers();
            } catch (err) { notify('error', err.message); }
        }

        // ========== IMPERSONATE ==========
        async function impersonate(id) {
            const confirm = await Swal.fire({ title: 'Impersonate user?', text: 'You will be logged in as this user for 15 minutes.', icon: 'info', showCancelButton: true, confirmButtonText: 'Yes' });
            if (!confirm.isConfirmed) return;
            try {
                const res = await fetch(`https://rat-production-1899.up.railway.app/api/admin/impersonate/${id}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                if (!res.ok) throw new Error('Impersonation failed');
                const data = await res.json();
                localStorage.setItem('token', data.token);
                // Fetch user info to update local storage
                const userRes = await fetch(`https://rat-production-1899.up.railway.app/api/user`, {
                    headers: { 'Authorization': `Bearer ${data.token}` }
                });
                if (userRes.ok) {
                    const user = await userRes.json();
                    localStorage.setItem('user', JSON.stringify(user));
                }
                window.location.href = '/dashboard.html';
            } catch (err) { notify('error', err.message); }
        }

        // ========== BALANCE MODAL (quick adjust) ==========
        function openBalanceModal(id) {
            Swal.fire({
                title: 'Adjust Balance',
                html: `
                    <select id="bal_currency" class="swal2-input">
                        <option value="BTC">BTC</option><option value="ETH">ETH</option><option value="USDT">USDT</option>
                        <option value="TRON">TRON</option><option value="BNB">BNB</option><option value="XRP">XRP</option><option value="XLM">XLM</option>
                    </select>
                    <select id="bal_operation" class="swal2-input">
                        <option value="credit">Credit (Add)</option>
                        <option value="debit">Debit (Subtract)</option>
                    </select>
                    <input id="bal_amount" class="swal2-input" type="number" step="0.00000001" placeholder="Amount">
                `,
                showCancelButton: true,
                confirmButtonText: 'Apply',
                preConfirm: () => {
                    const currency = document.getElementById('bal_currency').value;
                    const operation = document.getElementById('bal_operation').value;
                    const amount = parseFloat(document.getElementById('bal_amount').value);
                    if (!amount || amount <= 0) { Swal.showValidationMessage('Invalid amount'); return; }
                    return { currency, operation, amount };
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    const { currency, operation, amount } = result.value;
                    try {
                        const res = await fetch(`https://rat-production-1899.up.railway.app/api/admin/users/${id}/balance`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` },
                            body: JSON.stringify({ currency, amount, operation })
                        });
                        if (!res.ok) throw new Error('Adjustment failed');
                        notify('success', 'Balance updated');
                        refreshUsers();
                    } catch (err) { notify('error', err.message); }
                }
            });
        }

        // ========== CREATE USER ==========
        function openCreateUser() {
            new bootstrap.Modal(document.getElementById('createUserModal')).show();
        }

        document.getElementById('createUserForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const full_name = document.getElementById('c_fullname').value;
            const email = document.getElementById('c_email').value;
            const password = document.getElementById('c_password').value;
            const phone = document.getElementById('c_phone').value;
            const country = document.getElementById('c_country').value;
            const role = document.getElementById('c_role').value;
            try {
                const res = await fetch(`https://rat-production-1899.up.railway.app/api/admin/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` },
                    body: JSON.stringify({ full_name, email, password, phone, country, role })
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'Creation failed');
                }
                notify('success', 'User created successfully');
                bootstrap.Modal.getInstance(document.getElementById('createUserModal')).hide();
                refreshUsers();
            } catch (err) { notify('error', err.message); }
        });

        // ========== NOTIFICATIONS ==========
        async function loadNotifications() {
            try {
                const res = await fetch(`https://rat-production-1899.up.railway.app/api/admin/notifications`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                if (!res.ok) throw new Error('Failed to fetch notifications');
                const notifs = await res.json();
                const tbody = document.getElementById('notificationsTableBody');
                if (!notifs || notifs.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center">No notifications</td></tr>`;
                    return;
                }
                let html = '';
                notifs.forEach(n => {
                    html += `
                        <tr>
                            <td>${n.id}</td>
                            <td>${n.user_name || 'All Users'}</td>
                            <td>${n.title || '-'}</td>
                            <td>${n.message}</td>
                            <td>${new Date(n.created_at).toLocaleString()}</td>
                            <td><button class="btn btn-sm btn-danger" onclick="deleteNotification(${n.id})"><i class="fas fa-trash"></i></button></td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            } catch (err) {
                document.getElementById('notificationsTableBody').innerHTML = `<tr><td colspan="6" class="text-center text-danger">${err.message}</td></tr>`;
            }
        }

        async function deleteNotification(id) {
            if (!confirm('Delete this notification?')) return;
            try {
                const res = await fetch(`https://rat-production-1899.up.railway.app/api/admin/notifications/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                if (!res.ok) throw new Error('Delete failed');
                notify('success', 'Notification deleted');
                loadNotifications();
            } catch (err) { notify('error', err.message); }
        }

        // ========== LOGOUT ==========
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
        }

        // ========== POLLING ==========
        setInterval(refreshUsers, 60000);
        setInterval(loadNotifications, 60000);
    </script>
